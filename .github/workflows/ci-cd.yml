name: MLOps Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  data-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate dataset
        run: python -m src.data.validate

  train:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Feature engineering
        run: python -m src.features.build_features

      - name: Train model
        run: python -m src.models.train

      - name: Evaluate model
        run: python -m src.models.evaluate

      - name: Register model
        run: python -m src.models.registry

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/checkpoints/
            models/onnx/
            tokenizer/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t human-ai-detect:latest -f docker/Dockerfile .

      - name: Run container smoke test
        run: |
          docker run -d --name human-ai-detect -p 8080:8080 human-ai-detect:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "Health check passed"
              docker stop human-ai-detect
              docker rm human-ai-detect
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 2
          done
          echo "Health check failed after retries"
          docker logs human-ai-detect
          docker stop human-ai-detect || true
          docker rm human-ai-detect || true
          exit 1